spring.application.name=backend

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/markcamp
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Keeps "Failing row contains (...)" out of exception messages, and so out of the logs: names and coordinates are never
# logged. On the pool and not in the URL, because tests get their URL from the container and must run with this too.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A wrong JSON type is an error (ADR 0006). Covers string to number or boolean; see JacksonConfig for the rest.
spring.jackson.mapper.allow-coercion-of-scalars=false
# A wrong JSON type is MALFORMED_REQUEST (ADR 0006), and truncating 5.5 to 5 would silently change the value.
spring.jackson.deserialization.accept-float-as-int=false

markcamp.auth.firebase.project-id=${FIREBASE_PROJECT_ID}

# How far in the future an occurred_at may be, because phone clocks drift (ADR 0005, rule 2).
markcamp.events.max-clock-skew=10m
