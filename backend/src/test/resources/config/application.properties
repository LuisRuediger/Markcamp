# Spring Boot reads classpath:/config/application.properties on top of classpath:/application.properties,
# so this only overrides the keys below and keeps the rest of src/main/resources/application.properties.
# Fixed project id so tests never depend on FIREBASE_PROJECT_ID in the developer's .env.
markcamp.auth.firebase.project-id=markcamp-test
# Nothing listens on port 1: a test class that forgets PostgresTestContainer fails instead of writing to the dev database.
spring.datasource.url=jdbc:postgresql://localhost:1/tests-must-use-testcontainers
